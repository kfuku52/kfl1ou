name: R dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - DESCRIPTION
      - .github/scripts/audit-r-dependencies.R
      - .github/workflows/r-dependency-audit.yaml
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cran-dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          dependencies: '"all"'
          # pak can omit transitive LinkingTo-only packages when it installs
          # pre-built binaries. Include cpp11 so the SBOM can still traverse
          # the complete source/build dependency graph.
          extra-packages: any::curl, any::jsonlite, any::cpp11
          needs: check
      - name: Generate CycloneDX SBOM and query OSV
        run: Rscript .github/scripts/audit-r-dependencies.R
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-dependency-audit
          path: |
            r-dependency-audit.md
            r-dependency-sbom.cdx.json
            r-dependency-vulnerabilities.csv
          if-no-files-found: warn
          retention-days: 90
